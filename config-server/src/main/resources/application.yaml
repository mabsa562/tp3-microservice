spring:
  application:
    name: config-server

  profiles:
    active: native     # profil natif : lit les fichiers du classpath

  cloud:
    config:
      server:
        native:
          search-locations: classpath:/config-repo/

server:
  port: 8888

eureka:
  client:
    service-url:
      defaultZone: http://service-discovery:8761/eureka/
