spring:
  application:
    name: service-discovery

server:
  port: 8761

eureka:
  client:
    register-with-eureka: false   # ne s'enregistre pas lui-meme
    fetch-registry: false         # ne recupere pas de registre externe
    service-url:
      defaultZone: http://localhost:8761/eureka/
      eureka:
        instance:
          prefer-ip-address: true
          ip-address: 127.0.0.1

  server:
    enable-self-preservation: false
    eviction-interval-timer-in-ms: 5000
